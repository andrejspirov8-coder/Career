name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: job-search

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  python:
    name: Python / lock, lint, tests, PDFs, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Verify lock and install
        run: |
          uv lock --check
          uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check src mcp tools cv tests
      - name: Format check
        run: uv run ruff format --check src mcp tools cv tests
      - name: Typecheck
        run: uv run pyright
      - name: Test
        run: make coverage-ratchet
      - name: Contract drift check
        run: |
          uv run python scripts/generate-contracts.py
          git diff --exit-code -- dashboard/lib/generated
      - name: Verify all CV outputs
        run: |
          uv run python cv/build_cv_pdf.py --all
          uv run --group dev python -m pytest -q tests/test_cv_build_validation.py
      - name: Audit runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/runtime-requirements.txt > /dev/null
          uvx pip-audit -r /tmp/runtime-requirements.txt

  dashboard:
    name: Dashboard / unit, typecheck, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: job-search/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: job-search/dashboard
        run: npm ci --include=dev
      - name: Unit tests
        working-directory: job-search/dashboard
        run: npm run test
      - name: Typecheck
        working-directory: job-search/dashboard
        run: npm run typecheck
      - name: Production build
        working-directory: job-search/dashboard
        run: npm run build
      - name: High-severity dependency audit
        working-directory: job-search/dashboard
        run: npm audit --audit-level=high --omit=dev

  e2e:
    name: Dashboard browser tests
    needs: [dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: job-search/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: job-search/dashboard
        run: npm ci --include=dev
      - name: Install Chromium
        working-directory: job-search/dashboard
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: job-search/dashboard
        run: npm run e2e

  smoke:
    name: Headless source-discovery smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Verify lock and install
        run: uv sync --locked --all-groups
      - name: Run headless source-discovery smoke
        run: uv run python scripts/smoke_sources.py
