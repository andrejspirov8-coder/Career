name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-job-search:
    name: Python job-search checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-search
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Check lockfile if present
        run: |
          if [ -f uv.lock ]; then
            uv lock --check
          else
            echo "uv.lock is not committed yet; running unlocked install. Generate locally with: uv lock"
          fi
      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked --all-groups
          else
            uv sync --all-groups
          fi
      - name: Lint
        run: uv run ruff check tools cv tests
      - name: Test
        run: uv run pytest

  raycast-extension:
    name: Raycast extension checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raycast-job-search-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: raycast-job-search-hub/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:ci
      - name: Test
        run: npm test -- --run

  repo-smoke:
    name: Repo-wide smoke harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-search
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: job-search/dashboard/package-lock.json
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked --all-groups
          else
            uv sync --all-groups
          fi
      - name: Run smoke harness
        run: make smoke
