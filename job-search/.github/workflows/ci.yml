name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-lint-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --group dev
      - run: uv run ruff check src mcp tools cv tests

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-test-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --group dev
      - run: uv run --group dev python -m pytest

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-dashboard-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Build
        run: npm run build
        working-directory: dashboard
      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: dashboard

  codeql-python:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  codeql-javascript:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  e2e:
    needs: [dashboard-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: npm run e2e
        working-directory: dashboard

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f README.md
      - run: test -f dashboard/package.json
      - run: test -f pyproject.toml
