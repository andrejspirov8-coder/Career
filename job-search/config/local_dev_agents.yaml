schema_version: career_local_dev_agent_settings_v2
ollama_host: http://127.0.0.1:11434

roles:
  planner:
    model: gpt-oss:20b
    timeout_seconds: 600
    sandbox: read-only
  explorer:
    model: gpt-oss:20b
    timeout_seconds: 600
    sandbox: read-only
  implementer:
    model: qwen3.6:35b-a3b-coding-nvfp4
    timeout_seconds: 1500
    sandbox: workspace-write
  reviewer:
    model: gpt-oss:20b
    timeout_seconds: 600
    sandbox: read-only

models:
  gpt-oss:20b:
    context_window: 32768
    use_cli_output_schema: false
    digest: 17052f91a42e97930aa6e28a6c6c06a983e6a58dbb00434885a0cf5313e376f7
  qwen3.5:35b-a3b-coding-nvfp4:
    context_window: 32768
    use_cli_output_schema: true
    digest: 6e73b30f8f1cfa06b979c842ba222ae21dad1e55e7c6748a7d8acad46fb340c4
  qwen3.6:35b-a3b-coding-nvfp4:
    context_window: 32768
    use_cli_output_schema: true
    digest: cd2692a833e66c4c98991b67e9fbaa0bb15a93285baac9240c022f2f40075b6d

implementer_candidates:
  - qwen3.6:35b-a3b-coding-nvfp4
  - qwen3.5:35b-a3b-coding-nvfp4
implementer_fallback: qwen3.5:35b-a3b-coding-nvfp4
secondary_reviewer_model: qwen3.5:35b-a3b-coding-nvfp4

snapshot:
  max_file_bytes: 20971520
  max_total_bytes: 524288000
  forbidden_prefixes:
    - .git
    - .venv
    - runtime
    - state
    - secrets
    - output
    - tmp
    - dashboard/.next
    - dashboard/node_modules
    - raycast-job-search-hub/node_modules
    - linkedin/.browser-profile
    - linkedin/.jobs-browser-profile
    - linkedin/run_logs
  forbidden_parts:
    - .aws
    - .gnupg
    - .ssh
    - __pycache__
    - .pytest_cache
    - .ruff_cache
    - .mypy_cache
    - credentials
    - secrets

limits:
  max_changed_files: 15
  max_diff_lines: 1000
  retry_count: 1
  retention_days: 30
  required_safe_runs: 10

planner:
  timezone: Europe/Vilnius
  schedule_time: "19:00"
  weekdays: [0, 1, 2, 3, 4]
  max_proposals_per_run: 5
  max_approved_implementations_per_day: 2
  scan_paths:
    - tools
    - tests
    - dashboard
    - raycast-job-search-hub/src
    - docs
    - src/career_job_search/core
    - src/career_job_search/domain
    - src/career_job_search/application
    - src/career_job_search/infrastructure
    - cv

autonomy:
  tier_one_safe_runs: 10
  tier_two_safe_runs: 20
  minimum_first_pass_rate: 0.8
  rolling_window: 20
  auto_apply_max_files: 3
  auto_apply_max_diff_lines: 300
  auto_apply_categories:
    - documentation
    - tests

resources:
  min_free_disk_bytes: 21474836480
  planner_min_battery_percent: 50
  implementer_requires_ac_power: true
  defer_during_job_automation: true
