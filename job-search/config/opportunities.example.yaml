opportunities:
  geography:
    default_regions:
      - Vilnius
      - Lithuania
      - Remote EU
  scoring:
    priority_regions:
      - Vilnius
      - Lithuania
      - Lietuva
      - Remote EU
    role_tracks:
      - name: business_process_operations
        weight: 1.0
        keywords:
          - business process
          - process improvement
          - operations analyst
          - process mapping
          - workflow documentation
          - implementation
          - requirements gathering
      - name: customer_operations
        weight: 1.3
        keywords:
          - customer operations
          - customer support
          - member support
          - partner support
          - SLA
          - quality
          - escalation
      - name: implementation_support
        weight: 0.9
        keywords:
          - implementation manager
          - onboarding
          - customer success operations
          - enablement
          - launch
          - vendor
      - name: retail_operations
        weight: 1.3
        keywords:
          - retail operations
          - store operations
          - stock control
          - inventory
          - KPI
          - area manager
          - field operations
      - name: luxury_retail_leadership
        weight: 1.35
        keywords:
          - luxury
          - boutique
          - clienteling
          - premium retail
          - visual merchandising
          - high jewelry
  liveness:
    max_page_checks: 12
    network_timeout_seconds: 6
  sources:
    inbox:
      enabled: true
      path: inbox/jobs
      exclude_name_patterns:
        - smoke
        - test
    company_watchlist:
      enabled: false
      companies:
        - name: Celine / LVMH
          careers_url: https://www.lvmh.com/en/join-us/our-job-offers
        - name: Richemont
          careers_url: https://careers.richemont.com/en/jobs/
        - name: Kering
          careers_url: https://www.kering.com/en/talent/job-offers/
        - name: Vinted
          careers_url: https://careers.vinted.com/jobs
        - name: Holafly
          careers_url: https://careers.holafly.com/jobs
        - name: Spreetail
          careers_url: https://jobs.lever.co/spreetail
        - name: Deel
          careers_url: https://jobs.ashbyhq.com/deel
        - name: Airalo
          careers_url: https://jobs.lever.co/airalo
        - name: Enode
          careers_url: https://jobs.ashbyhq.com/enode
        - name: Hightouch
          careers_url: https://boards.greenhouse.io/hightouch
        - name: n8n
          careers_url: https://n8n.io/careers/
        - name: Wolt
          careers_url: https://careers.wolt.com/en/jobs
        - name: Bolt
          careers_url: https://bolt.eu/en/careers/positions/
        - name: Zalando
          careers_url: https://jobs.zalando.com/en/jobs
        - name: Ignitis Group
          careers_url: https://careers.ignitis.lt
        - name: Citco
          careers_url: https://www.citco.com/careers
    ats:
      enabled: false
      network_timeout_seconds: 20
      providers:
        - provider: greenhouse
          company: Hightouch
          board_token: hightouch
          max_posts: 12
        - provider: lever
          company: Spreetail
          company_slug: spreetail
          max_posts: 12
        - provider: lever
          company: Airalo
          company_slug: airalo
          max_posts: 8
        - provider: ashby
          company: Deel
          job_board_name: deel
          max_posts: 50
        - provider: ashby
          company: Enode
          job_board_name: enode
          max_posts: 50
        - provider: smartrecruiters
          company: Example SmartRecruiters Company
          company_identifier: smartrecruiters
          enabled: false
          max_posts: 25
      fixtures: []
    linkedin:
      enabled: false
      mode: connected_chrome
      base_url: https://www.linkedin.com
      location: Vilnius, Lithuania
      posted_within_hours: 72
      max_queries: 6
      max_results_per_query: 10
      max_jobs: 40
      pages: 1
      max_detail_pages: 8
      timeout_ms: 20000
      settle_ms: 1000
      browser_channel: chrome
      headed: false
      profile_dir: linkedin/.jobs-browser-profile
      queries:
        - business process
        - operations manager
        - customer operations
        - implementation manager
        - retail operations
        - store manager
    cvmarket_rss:
      enabled: false
      feed_url: https://www.cvmarket.lt/rss-listings.xml
      network_timeout_seconds: 20
    cvonline_public_search:
      enabled: false
      base_url: https://www.cvonline.lt/lt/search
      queries:
        - operations manager
        - customer operations
        - implementation manager
        - business process
        - retail operations
        - store manager
        - commerce
        - supply chain
      max_results_per_query: 50
      max_queries: 6
      network_timeout_seconds: 20
    cvbankas_public_search:
      enabled: false
      base_url: https://www.cvbankas.lt/
      queries:
        - operations manager
        - customer operations
        - implementation manager
        - business process
        - retail operations
        - store manager
        - komercijos vadybininkas
        - pardavimu vadovas
      max_results_per_query: 50
      max_queries: 6
      network_timeout_seconds: 20
    workinlithuania_public_search:
      enabled: false
      base_url: https://workinlithuania.com
      search_page_url_template: https://workinlithuania.com/jobs/{query}
      network_timeout_seconds: 20
    uzt_open_data:
      enabled: false
      feed_url: https://uzt.gov.lt/api/v1/job-vacancies
      api_url: https://get.data.gov.lt/datasets/gov/uzt/ldv/Vieta
      municipality: Vilniaus miesto sav.
      max_records: 300
      network_timeout_seconds: 30
      live_fallback_enabled: true
      max_feed_age_days: 7
    job_board:
      enabled: false
      links:
        - title: Darbo.lt Vilnius search
          url: https://www.darbo.lt/darbas/vilnius/
          company: Darbo.lt
          description: Search page for Vilnius jobs
        - title: IRWork.lt search
          url: https://www.irwork.lt/
          company: IRWork
          description: Jobs portal
        - title: Renda.lt search
          url: https://www.renda.lt/
          company: Renda
          description: Jobs portal
    web_search:
      enabled: false
      links:
        - title: LinkedIn Operations Vilnius
          url: https://www.linkedin.com/jobs/search/?keywords=operations%20manager&location=Lithuania
          company: LinkedIn
        - title: CVBankas Vilnius career
          url: https://www.cvbankas.lt/karjera/vilnius/
          company: CVBankas
        - title: CVOnline vacancies
          url: https://www.cvonline.lt/lt/vacancies/
          company: CVOnline
