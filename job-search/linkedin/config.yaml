company_validation:
  backend: auto
  approve_threshold: 60
  review_threshold: 40
  llm_blend_weight: 0.4
  # HR / talent acquisition / executive search / hiring managers work across
  # sectors. Without this bump they get auto-rejected for "weak sector
  # alignment" even when they are clearly in our geo and persona target.
  # Boost is suppressed when a hard-reject flag is present (staffing_only,
  # wrong_sector, outreach_exclude_term).
  persona_cross_sector_boost: 25

profile_enrichment:
  enabled: true
  backend: exa
  mode: exa
  max_profiles_per_run: 10
  max_characters: 3000
  min_enriched_chars: 180
  only_statuses:
    - approved
    - review

llm:
  enabled: true
  provider: ollama
  base_url: http://127.0.0.1:11434
  temperature: 0.2
  timeout_seconds: 120
  keep_alive: 30m
  reasoning: false
  verbose: false
  trace: false
  trace_path: pipeline/llm_trace.jsonl
  fallback_to_rules: true
  default_chat_model: qwen3.5:35b-a3b-fast
  profile: balanced
  profiles:
    balanced: qwen3.5:35b-a3b-fast
    quality: gemma4:latest
    speed: qwen3.6:9b
  retry_enabled: true
  circuit_breaker_threshold: 3
  agents:
    discovery:
      model: qwen3.5:35b-a3b-fast
      enabled: true
      batch_hits: true
      regex_first: true
    company_analyst:
      model: qwen3.5:35b-a3b-fast
      enabled: true
    outreach_writer:
      model: qwen3.5:35b-a3b-fast
      enabled: true
      use_tools: false
      tools:
        - count_chars
        - lookup_candidate_evidence
        - get_cv_blurb
      max_tool_turns: 3
    supervisor:
      model: qwen3.5:35b-a3b-fast
      enabled: true
      only_on_review: true
      heavy_model: qwen3.6:latest
      use_tools: false
      tools:
        - lookup_company_history
        - lookup_persona_stats
      max_tool_turns: 3
  embed:
    model: nomic-embed-text:latest
    enabled: true
    cv_blend_weight: 0.3

# Full end-to-end automation (discovery → validate → rank → live send).
# Use: python3 tools/hiring_network_workflow.py graph run --full-auto --headed
automation:
  max_dispatch: 5
  require_llm_note: true
  include_queue_review: false
  use_persona_stats: true
  only_new: false
  use_validation_boost: true
  validation_boost_approved: 8
  validation_boost_review: 4
  validation_soften_hiring_min_score: 60
  preserve_discovery_persona: true
  preserve_discovery_personas:
    - recruiter_hr
    - executive_search
    - hiring_manager
  preserve_requires_geo: true
  recruiter_hr_queue_review_threshold: 55
