[project]
name = "career-job-search"
version = "0.1.0"
description = "Local-first CV, recruiter review, and job-search automation workspace."
requires-python = ">=3.11,<3.12"
dependencies = [
  "cryptography>=48.0.1,<51",
  "fastapi>=0.141.1",
  "httpx>=0.28,<1",
  "langchain-core>=1.4,<2",
  "langchain-ollama>=1.0,<2",
  "langgraph>=1.0,<2",
  "playwright>=1.40,<2",
  "pydantic-settings>=2.0,<3",
  "pydantic>=2.13,<3",
  "PyYAML>=6.0,<7",
  "qdrant-client>=1.13,<2",
  "reportlab>=4.0,<5",
  "uvicorn>=0.52.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pypdf>=5.0,<7",
  "ruff==0.15.22",
  "pytest==9.0.3",
  "pytest-cov>=7.1.0",
  "pyright>=1.1.411",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "cv"]
addopts = "-q"

[tool.coverage.run]
source = ["career_job_search"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "cv", "tests"]
include = ["src/**/*.py", "mcp/**/*.py", "tools/**/*.py", "cv/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = [
  "E501",  # line-length handled by formatter/readability review
  "RUF001",  # ambiguous-unicode in strings: en-dashes/€/Cyrillic are real content
  "RUF002",  # ambiguous-unicode in comments (same rationale)
  "RUF003",  # ambiguous-unicode in names (same rationale)
  "S603",  # subprocess calls are all explicit-argv (no shell=True); informational only
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "S603", "S607"]  # pytest-specific patterns
"scripts/smoke_sources.py" = ["S101"]  # assert-based CI smoke script

[tool.pyright]
include = [
  "src/career_job_search/core",
  "src/career_job_search/opportunities/sources",
  "src/career_job_search/api",
]
exclude = ["**/__pycache__"]
extraPaths = ["src", "cv"]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "basic"
