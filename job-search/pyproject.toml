[project]
name = "career-job-search"
version = "0.1.0"
description = "Local-first CV, recruiter review, and job-search automation workspace."
requires-python = ">=3.11,<3.12"
dependencies = [
  "cryptography>=48.0.1,<51",
  "fastapi>=0.141.1",
  "httpx>=0.28,<1",
  "langchain-core>=1.4,<2",
  "langchain-ollama>=1.0,<2",
  "langgraph>=1.0,<2",
  "playwright>=1.40,<2",
  "pydantic>=2.13,<3",
  "PyYAML>=6.0,<7",
  "qdrant-client>=1.13,<2",
  "reportlab>=4.0,<5",
  "supabase>=2.31.0",
  "uvicorn>=0.52.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "black==26.3.1",
  "pypdf>=5.0,<7",
  "ruff==0.4.2",
  "pytest==9.0.3",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "cv"]
addopts = "-q"

[tool.coverage.run]
source = ["career_job_search"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "cv", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "E501",  # line-length handled by formatter/readability review
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "S603", "S607"]  # pytest-specific patterns

[tool.black]
line-length = 88
target-version = ["py311"]
